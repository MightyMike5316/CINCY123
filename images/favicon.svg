<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127 127" width="127" height="127" role="img" aria-label="Westside-Old Window Repair window mark">
  <style>.c{fill:#17468F} @media (prefers-color-scheme: dark){.c{fill:#FFFFFF}}</style>
  
  <g class="c" fill="#17468F" transform="translate(17.0 0.0)">
    <defs>
      <mask id="mf" maskUnits="userSpaceOnUse" x="0" y="0" width="93" height="127">
        <rect width="93" height="127" fill="#fff"/>
        <circle cx="46.5" cy="63.5" r="18" fill="#000"/>
      </mask>
    </defs>
    <!-- thin outer edge -->
    <path fill-rule="evenodd" d="M0 0h93v127H0z M1.5 1.5v124h90V1.5z"/>
    <!-- main frame band (between outer white band and inner white line) -->
    <path fill-rule="evenodd" d="M8 8h77v111H8z M14 14v99h65V14z"/>
    <!-- four glass panes, with the ring cut out of their inner corners -->
    <g mask="url(#mf)">
      <rect x="21" y="21" width="22.5" height="39.5"/>
      <rect x="49.5" y="21" width="22.5" height="39.5"/>
      <rect x="21" y="66.5" width="22.5" height="39.5"/>
      <rect x="49.5" y="66.5" width="22.5" height="39.5"/>
    </g>
    <!-- solid hub inside the ring -->
    <circle cx="46.5" cy="63.5" r="12"/>
  </g>
</svg>
