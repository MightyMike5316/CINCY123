<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t2">
  <title id="t2">Before and after glazing repair on a wood window pane</title>
  <rect width="560" height="400" fill="#f7f3ea"/>
  <!-- before -->
  <rect x="30" y="40" width="230" height="280" fill="#d9cfb8" stroke="#8b7357" stroke-width="4"/>
  <rect x="55" y="65" width="180" height="230" fill="#cfe2ee"/>
  <path d="M55 65 h180 v230 h-180 Z" fill="none" stroke="#8d8577" stroke-width="12" stroke-dasharray="26 14"/>
  <path d="M70 90 l30 40 l-10 30" stroke="#7f8a92" stroke-width="2" fill="none"/>
  <text x="145" y="350" font-family="Georgia, serif" font-size="18" fill="#1f2a33" text-anchor="middle">Before: failed putty</text>
  <!-- after -->
  <rect x="300" y="40" width="230" height="280" fill="#f6efe2" stroke="#8b7357" stroke-width="4"/>
  <rect x="325" y="65" width="180" height="230" fill="#cfe2ee"/>
  <path d="M325 65 h180 v230 h-180 Z" fill="none" stroke="#f2e7d3" stroke-width="12"/>
  <path d="M325 65 h180 v230 h-180 Z" fill="none" stroke="#8b7357" stroke-width="2"/>
  <line x1="350" y1="90" x2="430" y2="150" stroke="#fff" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
  <text x="415" y="350" font-family="Georgia, serif" font-size="18" fill="#1f2a33" text-anchor="middle">After: new putty &amp; paint</text>
  <path d="M268 180 L292 180" stroke="#b5542a" stroke-width="5" stroke-linecap="round"/>
  <path d="M284 170 L294 180 L284 190" fill="none" stroke="#b5542a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
