  <rect x="80" y="30" width="400" height="320" fill="#e8dcc6" stroke="#8b7357" stroke-width="4"/>
  <rect x="100" y="50" width="360" height="280" fill="#cfe2ee" stroke="#8b7357" stroke-width="8"/>
