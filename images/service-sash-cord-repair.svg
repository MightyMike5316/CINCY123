<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t1">
  <title id="t1">Re-roping a double-hung window: new sash cord over the pulley to the iron weight</title>
  <rect width="560" height="400" fill="#f7f3ea"/>
  <rect x="60" y="30" width="80" height="340" fill="#3f2f24"/>
  <circle cx="100" cy="62" r="16" fill="#8a8f94" stroke="#55595d" stroke-width="3"/>
  <path d="M100 46 Q116 46 116 66 L116 300" stroke="#c9a46c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M84 62 L84 200" stroke="#c9a46c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="75" y="200" width="18" height="120" rx="4" fill="#2b2f33"/>
  <rect x="140" y="30" width="360" height="340" fill="#e8dcc6" stroke="#8b7357" stroke-width="4"/>
  <rect x="160" y="50" width="320" height="300" fill="#cfe2ee" stroke="#8b7357" stroke-width="12"/>
  <line x1="320" y1="50" x2="320" y2="350" stroke="#8b7357" stroke-width="12"/>
  <line x1="160" y1="200" x2="480" y2="200" stroke="#8b7357" stroke-width="12"/>
  <!-- knot detail -->
  <circle cx="116" cy="300" r="9" fill="#a8824a"/>
  <!-- arrow up: sash glides -->
  <path d="M520 300 L520 120" stroke="#b5542a" stroke-width="6" stroke-linecap="round"/>
  <path d="M504 140 L520 116 L536 140" fill="none" stroke="#b5542a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="388" font-family="Georgia, serif" font-size="18" fill="#1f2a33" text-anchor="middle">New cord, balanced weight — the sash glides and stays open</text>
</svg>
